<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review summaries</title><link rel="stylesheet" href="/summaries.css"></head>
<body>
<header><a class="back" href="/">← Agent traces</a><h1>Review summaries</h1><span id="count" role="status">Loading papers…</span></header>

</div><script type="module" src="/summaries.js"></script>
